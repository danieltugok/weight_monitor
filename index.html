<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weight Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EEEA; --surface:#F7F9F7; --ink:#1F2A2E; --muted:#5D6B6E; --line:#CBD5CF;
  --weight:#2B4C7E; --goal:#A23E6B; --on-accent:#fff;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#151B1D; --surface:#1D2528; --ink:#E4EAE7; --muted:#93A19F; --line:#33403F;
  --weight:#8FB3E8; --goal:#E58AB4; --on-accent:#151B1D;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 1rem/1.5 "Bricolage Grotesque",system-ui,sans-serif;font-variation-settings:"opsz" 14}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
:focus-visible{outline:2px solid var(--weight);outline-offset:2px}
button,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.top h1{font-size:1rem;font-weight:700;margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:4px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:.875rem}
.seg input:checked+label{background:var(--ink);color:var(--paper)}
.seg input:focus-visible+label{outline:2px solid var(--weight);outline-offset:1px}

/* Readout: the one loud element */
.readout{margin-bottom:12px}
.big{margin:0;line-height:.85;font-weight:800;letter-spacing:-.03em;
  font-size:clamp(5rem,26vw,9.5rem);font-variation-settings:"opsz" 96,"wdth" 75}
.big small{font-size:.28em;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:.15em}
.since{margin:12px 0 0;color:var(--muted)}

/* Tape-measure ruler from start weight to goal */
.ruler{margin:28px 0 8px}
.tape{position:relative;height:36px;border-bottom:2px solid var(--ink);
  background:
    repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10%) bottom/100% 14px no-repeat,
    repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 2%) bottom/100% 7px no-repeat}
.fill{position:absolute;left:0;bottom:0;height:100%;width:0;background:color-mix(in srgb,var(--weight) 18%,transparent);
  transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.marker{position:absolute;bottom:-6px;width:3px;height:calc(100% + 12px);background:var(--weight);transform:translateX(-50%);
  border-radius:2px;left:0;transition:left 1.2s cubic-bezier(.2,.8,.2,1)}
.goalpin{position:absolute;right:0;bottom:0;width:3px;height:100%;background:var(--goal);transform:translateX(50%)}
.ends{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted);margin-top:8px}
.ends b{color:var(--goal);font-weight:600}
.pace{margin:16px 0 0;font-size:1.125rem}

/* Log bar */
.log{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:12px;margin:40px 0}
.field{display:flex;flex-direction:column;gap:2px;flex:1 1 130px;font-size:.8125rem;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;font-size:1rem;color:var(--ink);min-width:0}
.field.weight input{font-size:1.25rem;font-weight:700}
.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--weight);color:var(--on-accent);font-weight:700;cursor:pointer;flex:1 1 100%}
.btn:active{transform:translateY(1px)}
@media (min-width:520px){.btn{flex:0 0 auto}}

h2{font-size:1.125rem;font-weight:700;margin:0 0 12px}
.chart{position:relative;height:260px;margin:0 -4px 40px}

/* History */
.history{list-style:none;margin:0 0 24px;padding:0}
.history li{display:grid;grid-template-columns:1fr auto 4.5rem 2rem;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.history .w{font-weight:700}
.history .d{color:var(--muted);text-align:right;font-size:.875rem}
.del{border:0;background:none;color:var(--muted);cursor:pointer;width:2rem;height:2rem;border-radius:8px}
.del:hover{background:var(--surface);color:var(--goal)}
.empty{color:var(--muted)}

/* Goal + backup */
details{border-top:1px solid var(--line);padding:16px 0}
summary{cursor:pointer;font-weight:600}
details form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:12px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0;font-size:.9375rem}
.backup{display:flex;gap:20px;margin-top:8px}
.backup label{cursor:pointer}

@media (prefers-reduced-motion:reduce){.fill,.marker{transition:none}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Weight Monitor</h1>
    <fieldset class="seg" aria-label="Unit">
      <input type="radio" name="unit" id="u-kg" value="kg"><label for="u-kg">kg</label>
      <input type="radio" name="unit" id="u-lb" value="lb"><label for="u-lb">lb</label>
    </fieldset>
  </header>

  <section class="readout" aria-live="polite">
    <p class="big num"><span id="current">–</span><small class="u"></small></p>
    <p class="since num" id="since">Loading…</p>
  </section>

  <section class="ruler" id="ruler" hidden aria-label="Progress toward goal">
    <div class="tape"><div class="fill" id="fill"></div><div class="goalpin"></div><div class="marker" id="marker"></div></div>
    <div class="ends num"><span id="startLabel"></span><b id="goalLabel"></b></div>
    <p class="pace num" id="pace"></p>
  </section>

  <form class="log" id="entryForm">
    <label class="field">Date <input type="date" id="entryDate" required></label>
    <label class="field weight"><span>Weight (<span class="u"></span>)</span> <input type="number" id="entryWeight" step="0.1" min="1" inputmode="decimal" placeholder="0.0" required></label>
    <button class="btn">Save weight</button>
  </form>

  <h2>Progress</h2>
  <div class="chart"><canvas id="chart" aria-label="Chart of weight over time with the path to the goal" role="img"></canvas></div>

  <h2>History</h2>
  <ul class="history num" id="history"></ul>

  <details id="goalBox">
    <summary id="goalSummary">Set a goal</summary>
    <form id="goalForm">
      <label class="field"><span>Target weight (<span class="u"></span>)</span> <input type="number" id="goalWeight" step="0.1" min="1" inputmode="decimal" required></label>
      <label class="field">Reach it by <input type="date" id="goalDate" required></label>
      <button class="btn">Save goal</button>
      <button type="button" class="link" id="clearGoal">Remove goal</button>
    </form>
  </details>

  <details>
    <summary>Backup</summary>
    <div class="backup">
      <button type="button" class="link" id="exportBtn">Download backup</button>
      <label class="link">Restore from backup <input type="file" id="importFile" accept="application/json" hidden></label>
    </div>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const KG_PER_LB = 0.45359237;
const DAY = 864e5;
const $ = id => document.getElementById(id);

// Data comes from the server (always in kg). The unit is each viewer's own display preference.
let state = { entries: [], goal: null };
let unit = 'kg';
try { unit = localStorage.getItem('weight-monitor-unit') === 'lb' ? 'lb' : 'kg'; } catch {}

const toUnit = kg => unit === 'kg' ? kg : kg / KG_PER_LB;
const toKg = v => unit === 'kg' ? v : v * KG_PER_LB;
const fmt = kg => toUnit(kg).toFixed(1) + ' ' + unit;
const signed = kg => (kg > 0 ? '+' : kg < 0 ? '−' : '±') + Math.abs(toUnit(kg)).toFixed(1);
const ts = d => new Date(d + 'T00:00:00').getTime();
const today = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD in local time
const showDate = d => new Date(ts(d)).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });

console.assert(Math.abs(100 * KG_PER_LB / KG_PER_LB - 100) < 1e-9, 'lb/kg round trip');

async function api(body) {
  const r = await fetch('api.php', body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    : { cache: 'no-store' });
  const data = await r.json().catch(() => ({ error: 'Server error (' + r.status + ')' }));
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}
async function refresh() {
  try { state = await api(); } catch (e) { alert('Could not load your data: ' + e.message); }
  render();
}
// Sends a change to the server, then reloads. Returns false (and keeps the form filled) on failure.
async function write(body) {
  try { await api(body); } catch (e) { alert(e.message); await refresh(); return false; }
  await refresh();
  return true;
}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
Chart.defaults.font.family = '"Bricolage Grotesque", system-ui, sans-serif';
const chart = new Chart($('chart'), {
  type: 'line',
  data: { datasets: [
    { label: 'Weight', data: [], borderColor: css('--weight'), backgroundColor: css('--weight'), borderWidth: 2.5, pointRadius: 3, tension: .3 },
    { label: 'Path to goal', data: [], borderColor: css('--goal'), backgroundColor: css('--goal'), borderWidth: 2, borderDash: [6, 6], pointRadius: [0, 5] },
  ]},
  options: {
    maintainAspectRatio: false,
    layout: { padding: { left: 6, right: 8, top: 6 } },
    interaction: { mode: 'nearest', intersect: false },
    scales: {
      x: { type: 'linear', grid: { display: false }, border: { color: css('--line') },
           ticks: { color: css('--muted'), maxTicksLimit: 5, callback: v => new Date(v).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) } },
      y: { grid: { color: css('--line') }, border: { display: false }, ticks: { color: css('--muted'), maxTicksLimit: 6 } },
    },
    plugins: {
      legend: { position: 'bottom', align: 'start', labels: { color: css('--muted'), boxWidth: 14, boxHeight: 2 } },
      tooltip: { callbacks: {
        title: i => new Date(i[0].parsed.x).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }),
        label: i => `${i.dataset.label}: ${i.parsed.y.toFixed(1)} ${unit}`,
      } },
    },
  },
});

function render() {
  const e = state.entries, g = state.goal; // server returns entries sorted by date
  const last = e.at(-1), first = e[0];
  $('u-' + unit).checked = true;
  document.querySelectorAll('.u').forEach(s => s.textContent = unit);

  $('current').textContent = last ? toUnit(last.kg).toFixed(1) : '–';
  $('since').textContent = !last ? 'No weights yet. Log today’s weight below to start.'
    : e.length > 1 ? `${signed(last.kg - first.kg)} ${unit} since ${showDate(first.date)}`
    : `Logged ${showDate(last.date)}`;

  // Ruler: start weight on the left, goal on the right, marker at the latest weight.
  $('ruler').hidden = !(g && last);
  if (g && last) {
    const total = g.kg - first.kg, done = last.kg - first.kg;
    const pct = total ? Math.min(100, Math.max(0, done / total * 100)) : 100;
    requestAnimationFrame(() => { $('fill').style.width = pct + '%'; $('marker').style.left = pct + '%'; });
    $('startLabel').textContent = 'Start ' + fmt(first.kg);
    $('goalLabel').textContent = 'Goal ' + fmt(g.kg);
    const remaining = g.kg - last.kg;
    const days = Math.round((ts(g.date) - ts(today())) / DAY);
    $('pace').textContent = remaining * Math.sign(total || 1) <= 0 ? `Goal reached. ${fmt(g.kg)} was the target.`
      : days > 0 ? `${fmt(Math.abs(remaining))} to go. That’s ${fmt(Math.abs(remaining) / (days / 7))} a week until ${showDate(g.date)}.`
      : `${fmt(Math.abs(remaining))} to go. The goal date, ${showDate(g.date)}, has passed. Set a new date below.`;
  }

  $('goalSummary').textContent = g ? `Goal: ${fmt(g.kg)} by ${showDate(g.date)}` : 'Set a goal';
  if (g) { $('goalWeight').value = toUnit(g.kg).toFixed(1); $('goalDate').value = g.date; }

  chart.data.datasets[0].data = e.map(x => ({ x: ts(x.date), y: toUnit(x.kg) }));
  chart.data.datasets[1].data = g && last ? [{ x: ts(last.date), y: toUnit(last.kg) }, { x: ts(g.date), y: toUnit(g.kg) }] : [];
  chart.options.plugins.legend.display = !!(g && last);
  // Fit the date axis to the data instead of Chart.js's rounded padding.
  chart.options.scales.x.min = first ? ts(first.date) : undefined;
  chart.options.scales.x.max = g && last ? Math.max(ts(g.date), ts(last.date)) : last ? ts(last.date) : undefined;
  chart.update();

  $('history').innerHTML = e.length ? e.map((x, i) => `<li>
      <span>${showDate(x.date)}</span>
      <span class="w">${fmt(x.kg)}</span>
      <span class="d">${i ? signed(x.kg - e[i - 1].kg) : ''}</span>
      <button class="del" data-del="${x.date}" aria-label="Delete entry for ${showDate(x.date)}">✕</button>
    </li>`).reverse().join('')
    : '<li class="empty">Your weights will be listed here.</li>';
}

$('entryForm').onsubmit = async ev => {
  ev.preventDefault();
  if (await write({ action: 'save_entry', date: $('entryDate').value, kg: toKg(+$('entryWeight').value) })) $('entryWeight').value = '';
};

$('goalForm').onsubmit = ev => {
  ev.preventDefault();
  write({ action: 'set_goal', kg: toKg(+$('goalWeight').value), date: $('goalDate').value });
};

$('clearGoal').onclick = async () => { if (await write({ action: 'clear_goal' })) $('goalForm').reset(); };

document.querySelectorAll('input[name=unit]').forEach(r => r.onchange = () => {
  unit = r.value;
  try { localStorage.setItem('weight-monitor-unit', unit); } catch {}
  render();
});

$('history').onclick = ev => {
  const date = ev.target.dataset.del;
  if (date && confirm('Delete the entry for ' + showDate(date) + '?')) write({ action: 'delete_entry', date });
};

$('exportBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ entries: state.entries, goal: state.goal }, null, 2)], { type: 'application/json' }));
  a.download = `weight-monitor-${today()}.json`;
  a.click();
};

$('importFile').onchange = async ev => {
  try {
    const data = JSON.parse(await ev.target.files[0].text());
    if (confirm('Replace all your data with this backup?')) await write({ action: 'import', entries: data.entries, goal: data.goal ?? null });
  } catch { alert('That file isn’t a Weight Monitor backup. Choose a .json file downloaded from this page.'); }
  ev.target.value = '';
};

$('entryDate').value = today();
refresh();
</script>
</body>
</html>
